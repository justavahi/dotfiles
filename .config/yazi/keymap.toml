# e KEYBINDING
[[mgr.prepend_keymap]]
on  = [ "e" ]
run = "shell 'nvim .' --block"
desc = "Open Neovim"

# cc KEYBINDING
[[mgr.prepend_keymap]]
on = [ "c", "c" ]
run = "cat '$1' | wl-copy"
desc = "Copy file content"

# d KEYBINDINGS
[[mgr.prepend_keymap]]
on  = [ "d", "d" ]
run = [ "remove --permanently --force", "escape --visual --select" ]
desc = "Delete hovered file"

[[mgr.prepend_keymap]]
on  = [ "d", "G" ]
run = [ "visual_mode", "arrow bot", "remove --permanently"]
desc = "Delete to end"

[[mgr.prepend_keymap]]
on  = [ "d", "g" ]
run = [ "visual_mode", "arrow top", "remove --permanently"]
desc = "Delete to beginning"

# CD
[[mgr.prepend_keymap]]
on  = [ "c", "p" ]
run = "cd --interactive"
desc = "Change path interactively"

# ZOOM (requere `imagemagick` package)
[[mgr.prepend_keymap]]
on   = "+"
run  = "plugin zoom 1"
desc = "Zoom in hovered file"

[[mgr.prepend_keymap]]
on   = "-"
run  = "plugin zoom -1"
desc = "Zoom out hovered file"

# HOPS
[[mgr.prepend_keymap]]
on = "H"
run = "plugin bunny"
desc = "Open hops menu"

# CHMOD
[[mgr.prepend_keymap]]
on   = [ "c", "m" ]
run  = "plugin chmod"
desc = "Chmod on selected files"

